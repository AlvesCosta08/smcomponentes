services:
  - type: web
    name: smcomponentes
    runtime: image
    repo: https://github.com/seu-usuario/smcomponentes
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: seu-host-do-mysql
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: seu-banco
      - key: DB_USERNAME
        value: seu-usuario
      - key: DB_PASSWORD
        value: sua-senha
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs
      php artisan key:generate --force
      chmod -R 777 storage bootstrap/cache
    startCommand: |
      php artisan serve --host=0.0.0.0 --port=$PORT
