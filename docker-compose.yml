services:
  app:
    build: .
    container_name: smcomponentes_app
    ports:
      - "8080:8000"
    volumes:
      - .:/var/www
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
    networks:
      - smcomponentes-network

  db:
    image: mysql:8.0
    container_name: smcomponentes_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: smcomponentes
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - smcomponentes-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smcomponentes_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - smcomponentes-network

networks:
  smcomponentes-network:
    driver: bridge

volumes:
  db_data:

