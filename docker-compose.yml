services:
  mysql:
    image: mysql:8.0
    container_name: sm_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vendas
      TZ: America/Sao_Paulo
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - sm_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sm_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - sm_network

volumes:
  mysql_data:

networks:
  sm_network:
    driver: bridge